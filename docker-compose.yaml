services:
  postgres:
    image: postgres:18.4
    container_name: postgres-elearning-api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: elearning_api
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elearning_api"]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - elearning-network

  redis:
    image: redis:8.6.4
    container_name: redis-elearning-api
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - elearning-network

volumes:
  postgres-data:
  redis-data:

networks:
  elearning-network: